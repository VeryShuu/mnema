<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>{% block title %}Mnema{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#222}
nav{background:#1d2733;color:#fff;padding:.6rem 1rem}
nav a{color:#cfe1ff;margin-right:1rem;text-decoration:none}
main{max-width:1100px;margin:1rem auto;padding:0 1rem}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid #dde;padding:.4rem .6rem;text-align:left;font-size:.92rem}
.badge{padding:.1rem .5rem;border-radius:.6rem;font-size:.8rem;background:#e6e9ef}
.badge.done{background:#d5f0d5}.badge.failed{background:#f7d0d0}
.badge.recording,.badge.processing{background:#d0e4f7}.badge.awaiting_review,.badge.awaiting_llm{background:#fdeecd}
.card{background:#fff;border:1px solid #dde;border-radius:.5rem;padding:1rem;margin-bottom:1rem}
audio{width:100%}
button{cursor:pointer;padding:.3rem .8rem}
input,select{padding:.3rem}
pre{white-space:pre-wrap}
.log{font-family:monospace;font-size:.8rem;max-height:400px;overflow:auto}
.muted{color:#777;font-size:.85rem}
</style>
</head>
<body>
<nav>
  <a href="/">Дашборд</a>
  <a href="/jobs">Встречи</a>
  <a href="/protocols">Протоколы</a>
  <a href="/reviews">Уточнения</a>
  <a href="/voices">Реестр голосов</a>
  <a href="/health" target="_blank">Health</a>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
