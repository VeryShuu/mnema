services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    command: ["python", "-m", "mnema.api.main"]
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////data/db.sqlite
      - ARCHIVE_DIR=/data/archive
      - TZ=Europe/Moscow
      - APP_TZ=Europe/Moscow
      - EXPORT_DIR=${EXPORT_DIR:-}
    volumes:
      - data:/data
      - ./templates:/app/templates:ro
      # Samba-export: bind-mount hostovogo CIFS-maunta (/mnt/mnema-export) v
      # konteyner. Pustaya EXPORT_HOST_DIR (peremennaya ne zadana) ->
      # neaktivnyy katalog v /dev/null-export-deactivated (ne sudshchestvuet,
      # togda export_configured()=False i vygruzka — no-op). Nastroyka maunta:
      # scripts/smb-mount.sh.
      - "${EXPORT_HOST_DIR:-/dev/null-export-deactivated}:/export"
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
      args:
        WITH_ASR: "1"
    command: ["python", "-m", "mnema.worker.main"]
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////data/db.sqlite
      - ARCHIVE_DIR=/data/archive
      - TZ=Europe/Moscow
      - APP_TZ=Europe/Moscow
      - EXPORT_DIR=${EXPORT_DIR:-}
      # razdelenie vstrech (etap split): kill-switch 0, porogi, okno detekcii
      - SPLIT_MEETINGS=${SPLIT_MEETINGS:-1}
      - SPLIT_MIN_MINUTES=${SPLIT_MIN_MINUTES:-20}
      - SPLIT_MIN_CONFIDENCE=${SPLIT_MIN_CONFIDENCE:-0.7}
      - SPLIT_WINDOW_CHARS=${SPLIT_WINDOW_CHARS:-40000}
      # analiz LLM: okno stenogrammy na 1 zaprosov (context 131k) i ozhidanie ocheredi
      - LLM_WINDOW_CHARS=${LLM_WINDOW_CHARS:-60000}
      - LLM_LOCK_WAIT_TIMEOUT_S=${LLM_LOCK_WAIT_TIMEOUT_S:-7200}
      - LLM_REQUEST_TIMEOUT_S=${LLM_REQUEST_TIMEOUT_S:-900}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-6000}
    volumes:
      - data:/data
      - hf-cache:/root/.cache/huggingface
      - "${EXPORT_HOST_DIR:-/dev/null-export-deactivated}:/export"
    depends_on:
      - redis
    restart: unless-stopped

  web-bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.webbot
    env_file: .env
    environment:
      - ZOOM_PROFILE_DIR=/data/zoom-profile
      - DATA_DIR=/data
      - HEADFUL=1   # Chromium pod Xvfb, noVNC dlya vruchnuyu prokhoda reCAPTCHA (§12)
      - TZ=Europe/Moscow
    volumes:
      - data:/data
      - ./templates:/app/templates:ro
    ports:
      # noVNC: 8080 = ekran nastroyki (setup), 8080+slot = ekrany vstrech;
      # vnutrennie 6080+slot (VNC_MAX_SLOTS po umolch. 20 -> diapazon 8080-8100).
      # §HT: ekrany bez autentifikatsii API — pri nedoverennoy seti uzhite
      # VNC_PUBLISH_BIND=127.0.0.1: (togda dostup cherno reverse-proxy/ssh-tunnel)
      # i/ili VNC_PASSWORD dlya samogo VNC-protokola.
      - "${VNC_PUBLISH_BIND:-}8080-8100:6080-6100"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  data:
  redis-data:
  hf-cache:
